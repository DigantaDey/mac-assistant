[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-mac"
version = "0.7.1"
description = "Aura — a private, offline voice assistant for macOS, with a native menu-bar app and the whole engine on your Mac."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aura Contributors" }]
keywords = ["macos", "voice-assistant", "offline", "laya", "apple-silicon", "on-device-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Topic :: Desktop Environment",
]

# The core runs on the standard library alone so it can be tested anywhere.
# Platform accelerators are optional extras — see [project.optional-components].
dependencies = []

[project.optional-dependencies]
mac = [
  "sounddevice>=0.4.6",      # microphone capture (PortAudio)
  "numpy>=1.26",             # PCM processing
  "openwakeword>=0.6",       # on-device wake word models (ONNX)
  "faster-whisper>=1.0",     # local STT (alternative to whisper.cpp)
  "laya>=0.3.22,<0.4",       # the System-1 decision model — the brain (Apache-2.0);
                             # ≥0.3.22: the trainer needs laya.agent._option_logits
  "piper-tts>=1.2",          # optional local TTS
  # Aura sees and clicks inside apps through the Accessibility API
  # (aura/ax.py). Without these every ax.* skill fails with
  # "No module named 'ApplicationServices'" — they are not optional on a Mac.
  "pyobjc-core>=10.0",
  "pyobjc-framework-Cocoa>=10.0",               # NSWorkspace (frontmost app)
  "pyobjc-framework-Quartz>=10.0",              # CGEvent clicks
  "pyobjc-framework-ApplicationServices>=10.0", # AXUIElement tree
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "numpy>=1.26",
  # Swift syntax gate that runs anywhere (see scripts/check_swift_syntax.py)
  "tree-sitter>=0.23", "tree-sitter-swift>=0.6"]

[project.scripts]
aura = "aura.__main__:main"

[project.urls]
Homepage = "https://github.com/DigantaDey/mac-assistant"

[tool.setuptools.packages.find]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16's default rule set is broader than this codebase was written
# against. Everything else stays enforced; these are documented, deliberate
# skips for patterns this codebase uses *on purpose*.
extend-ignore = [
    "BLE001",   # broad except at subsystem boundaries is the defensive
                # contract: audio, config, model loading must degrade,
                # never crash the session
    "S110",     # try/except/pass is an intentional soft-fail probe
    "PLW1510",  # probe subprocesses must not fail the loop when an
                # optional binary is missing
    "RUF059",   # unused unpacked variables: `_` placeholders are idiomatic
    "RUF015",   # style preference
    "ISC004",   # implicit string concat in collections is the house style
]
