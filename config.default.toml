# Aura — default configuration.
# This file ships sensible, privacy-first defaults. Copy it to
#   macOS:  ~/Library/Application Support/Aura/config.toml
#   other:  ~/.config/aura/config.toml
# and edit freely — everything here is optional.

profile = "auto"              # auto | mac | demo

[server]
host = "127.0.0.1"            # never expose the assistant beyond loopback
port = 7331

[wake]
enabled = true
mode = "manual"               # manual | openwakeword
models = ["hey_jarvis"]       # or absolute paths to YOUR trained phrase model
threshold = 0.55
refractory_seconds = 2.5
phrase = ""                   # e.g. "hey aura" — spoken prefix gate in always-on mode

[stt]
engine = "auto"               # auto | whisper_cpp | faster_whisper | null
language = "en"
whisper_model = ""            # e.g. "~/models/ggml-small.en.bin" (whisper.cpp)
faster_whisper_model = "small"

[planner]
# Aura's brain is Laya — a non-autoregressive decision model that answers
# typed questions in one forward pass. There is no LLM anywhere in the
# product: no model server, no Ollama, no gigabyte downloads.
#   laya   — the default: rules parse the everyday commands, Laya routes the rest
#   rules  — the deterministic rule layer alone
#   mock   — alias of rules (demo profile, tests)
engine = "laya"
max_actions = 3

[laya]
enabled = true
backend = "auto"              # auto uses the `laya` package; "heuristic" never loads it
confidence_threshold = 0.62   # a proposed action below this match score → ask.
                              # one narrow exception: a *safe* action whose words
                              # demonstrably match the request (see WORDS_OVERRIDE_MATCH
                              # in aura/safety.py) still runs — friction, not caution.
destructive_threshold = 0.55  # above this → ask
route_threshold = 0.30        # a routing pick below this is "no skill" (never acted on)
device = ""                   # "" = auto (MPS/CUDA/CPU); or "cpu", "mps", "cuda"
model = ""                    # "" = let the router choose per language
# Which checkpoint to load. Resolution order (first usable wins):
#   adapter_dir → checkpoint_dir → $AURA_LAYA_CHECKPOINT → the bundled
#   navigation checkpoint (assets/models/aura-nav-laya) → the hub default.
# The bundled checkpoint ships with the repo, so Laya works out of the box.
checkpoint_dir = ""
adapter_dir = ""              # your fine-tuned Laya checkpoint (feedback loop output)
preload = false               # true = hold every checkpoint in RAM (fastest)
max_loaded = 2                # checkpoints allowed to stay resident
call_budget_seconds = 6.0     # past this, the offline gate answers and the log says why
idle_unload_seconds = 0.0     # >0 releases the model after idle (reload on next use)

[logging]
# Everything the engine does is written to stderr (the app captures it into
# ~/Library/Logs/Aura.log) and to <data dir>/aura.log, and mirrored into the
# app's Activity feed at event_level. `python -m aura laya-check` proves the
# decision model end-to-end when something looks wrong.
level = "info"                # debug | info | warning | error
event_level = "info"
file = true

[tts]
engine = "auto"               # auto → `say` on macOS
enabled = true
voice = ""                    # e.g. "Samantha"; empty = system default
rate = 178

[safety]
# Strict mode: ask before EVERY action, even safe ones. Destructive and
# risky actions always ask — this setting can never turn that off.
show_plan_before_run = false
confirm_destructive = true
always_confirm = []
blocked_patterns = ["rm -rf /", "diskutil erase", "sudo dd"]

[session]
max_utterance_seconds = 12.0
end_of_speech_seconds = 0.7
confirmation_timeout_seconds = 45.0
max_session_seconds = 20.0    # active work only; confirmation wait is separate
idle_unload_seconds = 180.0
